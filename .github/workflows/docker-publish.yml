name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    environment:
      name: ghcr.io
      url: https://github.com/Shusek/animesub-stremio-addon/pkgs/container/animesub-stremio-addon

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: get_version
        run: |
          VERSION=$(cat version | tr -d "\n")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "GHCR_IMAGE=ghcr.io/shusek/animesub-stremio-addon" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.get_version.outputs.GHCR_IMAGE }}:${{ steps.get_version.outputs.VERSION }}
            ${{ steps.get_version.outputs.GHCR_IMAGE }}:latest
