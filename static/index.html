<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animesub.info Stremio Addon</title>

  <!-- Ikony -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      /* background: url('background.jpg') no-repeat center center/cover; */
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      color: #eee;
    }

    /* === BANNER === */
    .banner {
      width: 100%;
      background: rgba(45, 45, 45, 0.82);
      backdrop-filter: blur(10px);

      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 60px 20px;
      text-align: center;
    }

    .title {
      font-size: 80px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .description {
      max-width: 600px;
      margin: 0 auto 30px;
      font-size: 18px;
      color: #ccc;
    }

    /* === BUTTONS === */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 31px;
      border-radius: 33px;
      font-size: 15px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
      margin-top: 20px;
      margin-bottom: 20px;
      font-family: Arial, sans-serif;
    }

    .btn-green {
      background: #00a862;
      color: #ffffff;
    }

    .btn-green:hover {
      cursor: pointer;
    }

    /* === FOOTER === */
    footer {
      margin-top: auto;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #888;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .github {
      font-size: 20px;
      color: #aaa;
      transition: 0.2s;
    }

    .github:hover {
      color: #fff;
    }

    a {
      color: #00a862;
      text-decoration: none;
      transition: 0.2s;
    }

    a:hover {
      /* color: rgba(110,110,110,0.8); */
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .title {
        font-size: 42px;
      }

      .description {
        font-size: 16px;
      }
    }

    .file-path {
      margin-top: 20px;
      padding: 12px 16px;
      width: 100%;
      max-width: 800px;
      background-color: rgba(100, 100, 100, 0.82);
      border: 1px solid #555;
      border-radius: 6px;
      font-family: monospace;
      color: #ccc;
      word-break: break-all;
      user-select: all;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      max-width: 600px;
      font-size: 18px;
    }

    .file-input {
      width: 100%;
      max-width: 800px;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 14px;
      border: inset;
      border-width: 3px 3px;
      border-color: rgba(0, 0, 0, 0.8);
      background: none;
      color: #fff;
      outline: none;
      user-select: all;
      text-align: center;
      margin-top: 10px;
    }

    .config-panel {
      width: 100%;
      max-width: 600px;
      display: grid;
      gap: 16px;
      margin: 4px auto 12px;
      padding: 18px;
      background: rgba(28, 28, 28, 0.72);
      border: 1px solid #454545;
      border-radius: 6px;
      text-align: left;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label,
    .checkbox-field {
      font-size: 14px;
      font-weight: 700;
      color: #f4f4f4;
    }

    .select-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #5a5a5a;
      border-radius: 6px;
      background: #121212;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkbox-field input {
      width: 18px;
      height: 18px;
      accent-color: #00a862;
    }
  </style>
</head>

<body>

  <div class="banner">
    <div class="title">
      AnimeSub.info<br />Stremio Addon
    </div>

    <div class="description">
      Automatyczne wczytywanie polskich napisów<br>do anime z&nbsp;<a href="http://animesub.info">AnimeSub.info</a>
      w&nbsp;<a href="https://web.strem.io">Stremio</a>.
    </div>

    <form class="config-panel" id="config-form">
      <div class="field">
        <label for="language">Domyślny język napisów</label>
        <select class="select-input" id="language" name="language"></select>
      </div>

      <label class="checkbox-field" for="convert-ass">
        <input id="convert-ass" name="convert_ass" type="checkbox" />
        Konwertuj ASS/SSA do SRT
      </label>
    </form>

    <div class="buttons">

      <a href="{stremio_url}" class="btn btn-green" id="install-app">
        <i class="fa-solid fa-download"></i>
        Instaluj (App)
      </a>

      <a href="https://web.strem.io/#/addons?addon={manifest_url}" class="btn btn-green" id="install-web">
        <i class="fa-solid fa-download"></i>
        Instaluj (Web)
      </a>

    </div>
    <div class="file-path" style="text-align:center;">
      <p style="font-size: 14px; color: #888;">Link do manifestu:</p>
      <input class="file-input" id="manifest-url" readonly value="{manifest_url}" />
    </div>
    <br>
    <div style="margin-top:20px;">
      <a href="https://buycoffee.to/ludvickpro" target="_blank"><img
          src="https://buycoffee.to/static/img/share/share-button-primary.png" style="width: 175px; height: 46px"
          alt="Postaw mi kawę na buycoffee.to"></a>
    </div>
  </div>

  <footer>
    © {current_year} AnimeSub.info Stremio Addon v{version_placeholder}
    <a href="https://github.com/piotrek1488/animesub-stremio/tree/python" target="_blank" class="github">
      <i class="fab fa-github"></i>
    </a>
  </footer>

  <script>
    const publicUrl = "{public_url}";
    const defaultConfig = {default_config_json};
    const languageOptions = {language_options_json};
    const languageLabels = {
      pol: "Polski (pol)",
      eng: "English (eng)",
      jpn: "Japanese (jpn)",
      spa: "Spanish (spa)",
      por: "Portuguese (por)",
      fre: "French (fre)",
      ger: "German (ger)",
      ita: "Italian (ita)",
      cze: "Czech (cze)",
      slo: "Slovak (slo)",
      ukr: "Ukrainian (ukr)",
      rus: "Russian (rus)"
    };

    const languageSelect = document.getElementById("language");
    const convertAssInput = document.getElementById("convert-ass");
    const installAppLink = document.getElementById("install-app");
    const installWebLink = document.getElementById("install-web");
    const manifestUrlInput = document.getElementById("manifest-url");

    for (const code of languageOptions) {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = languageLabels[code] || code;
      languageSelect.appendChild(option);
    }

    languageSelect.value = defaultConfig.language;
    convertAssInput.checked = defaultConfig.convert_ass;

    function encodeConfig(config) {
      return btoa(JSON.stringify(config))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }

    function updateInstallLinks() {
      const config = {
        language: languageSelect.value,
        convert_ass: convertAssInput.checked
      };
      const manifestUrl = `${publicUrl}/${encodeConfig(config)}/manifest.json`;

      installAppLink.href = manifestUrl.replace(/^https?:\/\//, "stremio://");
      installWebLink.href = `https://web.strem.io/#/addons?addon=${encodeURIComponent(manifestUrl)}`;
      manifestUrlInput.value = manifestUrl;
    }

    languageSelect.addEventListener("change", updateInstallLinks);
    convertAssInput.addEventListener("change", updateInstallLinks);
    updateInstallLinks();
  </script>
</body>

</html>
